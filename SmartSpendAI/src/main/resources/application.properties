spring.application.name=SmartSpend AI
server.port=${PORT:8080}

# Local development database: data is stored in a local H2 file.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/smartspend;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# For production PostgreSQL on Render, configure:
# DB_DRIVER=org.postgresql.Driver
# JPA_DIALECT=org.hibernate.dialect.PostgreSQLDialect
# DATABASE_URL=jdbc:postgresql://HOST:5432/DATABASE
# DB_USERNAME=...
# DB_PASSWORD=...
